name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all

  # Optional smoke: C path/git (+ cmake when available). No exotic toolchains required.
  path-c-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cmake/ninja (apt)
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: build rig
        run: cargo build --release
      - name: smoke path C + cmake fixtures
        run: bash scripts/ci-smoke-path-c.sh
      - name: smoke path zig when available (else skip)
        run: bash scripts/ci-smoke-path-extra.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: test
        run: cargo test --all
