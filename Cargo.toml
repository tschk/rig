[package]
name = "rigpkg"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "ISC"
authors = ["Max Carter <undivisible@vk.com>"]
description = "Cross-language native dependency manager. Detect host lang, add libs via CLI, expose them in-process with equilibrium-ffi."
repository = "https://github.com/tschk/rig"
homepage = "https://github.com/tschk/rig"
readme = "README.md"
keywords = ["ffi", "polyglot", "package-manager", "equilibrium", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".rig-internal/", "examples/**/target/", "examples/**/zig-out/", "examples/**/.zig-cache/"]

[lib]
name = "rig"
path = "src/lib.rs"

[[bin]]
name = "rig"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
semver = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
equilibrium-ffi = "0.1.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[features]
default = []
# Optional heavier integration (network / toolchains)
tools = []
